name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: task_api_test
          POSTGRES_USER: task_api
          POSTGRES_PASSWORD: task_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_api -d task_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://task_api:task_api_test@localhost:5432/task_api_test
      TEST_DATABASE_URL: postgresql+psycopg://task_api:task_api_test@localhost:5432/task_api_test
      JWT_SECRET_KEY: ci-only-secret-not-used-in-production
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest
